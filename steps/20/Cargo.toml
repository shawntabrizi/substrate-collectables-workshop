[package]
name = "pallet-kitties"
version = "0.1.0"
description = "An NFT Marketplace for Kitties"
authors = ["Shawn Tabrizi <shawntabrizi@gmail.com>"]
homepage = "https://www.shawntabrizi.com/substrate-collectables-workshop/"
repository = "https://github.com/shawntabrizi/substrate-collectables-workshop"
edition = "2021"
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
frame = { version = "0.15.0", package = "polkadot-sdk-frame", default-features = false, features = ["runtime"] }

[dev-dependencies]
frame-system = { version = "46.0.0" }
pallet-balances = { version = "47.0.0" }

[patch.crates-io]
# ark-vrf 0.1.x versions are yanked on crates.io
ark-vrf = { git = "https://github.com/davxy/ark-vrf", tag = "v0.1.1" }

[features]
default = [ "std" ]
std = [ "codec/std", "frame/std", "scale-info/std" ]
try-runtime = []
